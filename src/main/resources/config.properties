# =====================================================================
#  Central test configuration (committed defaults - NO secrets here)
#
#  Override order (first wins):
#    -Dkey=value  >  ENV_VAR  >  config.local.properties  >  config-{env}.properties  >  this file
#  Select an environment profile with:  mvn test -Denv=qa
# =====================================================================

# ---------- Base URLs ----------
booking.base.url=https://restful-booker.herokuapp.com
gorest.base.url=https://gorest.co.in
fakestore.base.url=https://fakestoreapi.com
reqres.base.url=https://reqres.in
httpbin.base.url=http://httpbin.org
herokuapp.base.url=https://the-internet.herokuapp.com
contactlist.base.url=https://thinking-tester-contact-list.herokuapp.com

# ---------- Credentials / Tokens ----------
# Public demo credentials of the practice APIs
booking.username=admin
booking.password=password123
basic.auth.username=admin
basic.auth.password=admin
reqres.api.key=reqres-free-v1
# SECRET - supply via GOREST_TOKEN env var (CI secret) or config.local.properties
gorest.token=

# ---------- Execution ----------
# Request/response logging: "all" logs every call, "failures" logs only failed validations
log.level=failures
# Max acceptable response time used by RestClient response specs (ms)
max.response.time.ms=10000
# How many times a failed test is retried (flaky public APIs)
retry.count=1

# ---------- Test data ----------
email.domain=@gmail.com
upload.file.path=files/sample-upload.txt
